name: Build Windows Executable

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: |
        pip install PyQt5 mne pyqtgraph numpy scipy matplotlib h5py pyinstaller
    - run: |
        pyinstaller --onefile --windowed --name=NeuralDataAnalysis main.py
    - uses: actions/upload-artifact@v4
      with:
        name: NeuralDataAnalysis-Windows
        path: dist/NeuralDataAnalysis.exe