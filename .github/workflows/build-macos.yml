name: Build macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install PyQt5 --only-binary=:all:
        pip install numpy==1.24.3
        pip install scipy==1.10.1
        pip install matplotlib==3.7.2
        pip install h5py==3.9.0
        pip install pyqtgraph==0.13.3
        pip install mne==1.5.0
        pip install pyinstaller==6.3.0
    
    - name: Create PyInstaller spec for macOS
      run: |
        cat > NeuralDataAnalysis.spec << 'EOF'
        # -*- mode: python ; coding: utf-8 -*-
        from PyInstaller.utils.hooks import collect_data_files, collect_submodules

        # Collect all MNE data and submodules
        mne_datas = collect_data_files('mne', include_py_files=True)
        mne_hiddenimports = collect_submodules('mne')

        a = Analysis(
            ['main.py'],
            pathex=[],
            binaries=[],
            datas=mne_datas,
            hiddenimports=mne_hiddenimports + [
                'scipy.special._ufuncs_cxx',
                'scipy.linalg.cython_blas',
                'scipy.linalg.cython_lapack',
                'scipy.integrate',
                'scipy.sparse.csgraph._validation',
                'h5py.defs',
                'h5py.utils',
                'h5py.h5ac',
                'h5py._proxy',
                'pyqtgraph.graphicsItems',
                'pyqtgraph.widgets',
                'lazy_loader',
            ],
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=['matplotlib.tests', 'numpy.random._examples', 'tkinter'],
            noarchive=False,
        )

        pyz = PYZ(a.pure, a.zipped_data)

        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.zipfiles,
            a.datas,
            [],
            name='NeuralDataAnalysis',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=False,
            disable_windowed_traceback=False,
        )

        app = BUNDLE(
            exe,
            name='NeuralDataAnalysis.app',
            bundle_identifier='com.neuraldata.analysis',
        )
        EOF
    
    - name: Build macOS app
      run: |
        pyinstaller NeuralDataAnalysis.spec --clean
    
    - name: Zip the app bundle
      run: |
        cd dist
        zip -r NeuralDataAnalysis-macOS.zip NeuralDataAnalysis.app
    
    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: macos-${{ steps.date.outputs.date }}
        name: macOS Build ${{ steps.date.outputs.date }}
        files: dist/NeuralDataAnalysis-macOS.zip
        draft: false
        prerelease: false
